# ═══════════════════════════════════════════════════════════════════════════
#  Cargo.toml — «شناسنامهٔ» پروژهٔ Rust
#  هر چیزی که cargo برای ساختن پروژه لازم دارد از همین فایل خوانده می‌شود.
#  این فایل به زبان TOML نوشته شده (شبیه INI ولی با تایپ‌های واقعی).
# ═══════════════════════════════════════════════════════════════════════════

[package]
# نام بسته (crate). با خط‌تیره یا کاراکتر غیرمجاز نمی‌شود؛ فقط a-z, 0-9, -, _
name = "ar"
version = "0.1.0"           # نسخهٔ معنایی (SemVer): MAJOR.MINOR.PATCH
edition = "2024"            # «نسخهٔ زبانی»؛ جدیدترین نسخه که از Rust 1.85 پایدار شد
rust-version = "1.85"       # حداقل کامپایلر لازم (MSRV) — ابزارها با این فیلد کنار می‌آیند
authors = ["amirui123"]
description = "ar — پروژهٔ آموزشی/واقعی Rust: مدیریت کارها + سرور HTTP + دموی همهٔ مفاهیم، با صفر وابستگی"
license = "MIT"             # نوع مجوز؛ LICENSE در ریشهٔ مخزن موجود است
repository = "https://github.com/amirui123/ar"
keywords = ["learning", "rust", "cli", "http", "tutorial"]
categories = ["command-line-utilities", "education"]

# ⚠️ این پروژه *عمداً* هیچ وابستگی بیرونی ندارد.
# دلیل آموزشی: همهٔ کارها با کتابخانهٔ استاندارد (std) انجام می‌شود تا صفر تا صد
# کدِ واقعی را خودت ببینی — نه اینکه جادوی یک crate انجامش بدهد.
[dependencies]
# (خالی)

# پروفایل dev: سرعت کامپایل مهم‌تر از سرعت اجراست، ولی کمی بهینه‌سازی هم می‌کنیم
# تا برنامه‌های عددی (مثل دموی benchmark) خیلی کند نباشند.
[profile.dev]
opt-level = 1               # 0 = بدون بهینه‌سازی؛ 1 = سریع کامپایل می‌شود و تازه «قابل تحمل» است
debug = true                # اطلاعات دیباگ برای gdb/lldb

# پروفایل dev برای وابستگی‌ها: همیشه کامل بهینه (چون دیگر تغییر نمی‌کنند)
[profile.dev.package."*"]
opt-level = 3

# پروفایل release: `cargo build --release` → حداکثر سرعت اجرا
[profile.release]
opt-level = 3               # بالاترین سطح بهینه‌سازی (شبیه -O3)
lto = "fat"                 # Link-Time Optimization: بهینه‌سازی *بین* کریت‌ها، کندتر ولی سریع‌تر
codegen-units = 1           # یک واحد کدگن → بهینه‌سازی بهتر (کامپایل کندتر)
panic = "unwind"            # در صورت panic، «بازگشایی پشته» انجام شود (برای تست و Drop سالم‌تر)
strip = "debuginfo"         # باینری نهایی سبک‌تر شود

# پروفایل مخصوص تست‌های سریع (اختیاری): cargo test --profile bench-lite
[profile.bench]
inherits = "release"
